# ===========================================
# 🐳 DOCKER COMPOSE - SAAS BACKEND
# Stack simplificado (solo backend)
# ===========================================

version: '3.8'

services:
  # ========================================
  # 🚀 Backend NestJS
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: saas-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "mail.syncronize.net.pe:86.48.26.221"
    environment:
      # Las variables se configuran en Portainer
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - MAX_LOGIN_ATTEMPTS=${MAX_LOGIN_ATTEMPTS:-5}
      - LOCKOUT_DURATION_MINUTES=${LOCKOUT_DURATION_MINUTES:-15}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - BACKEND_URL=${BACKEND_URL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEBUG=${DEBUG:-false}
      - REDIS_SESSION_TTL=${REDIS_SESSION_TTL:-604800}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
    # volumes:
    #   - ./logs:/app/logs  # Deshabilitado - solo console logging por ahora
    networks:
      - elastika-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.syncronize.net.pe`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
      # Redirect HTTP to HTTPS
      - "traefik.http.routers.backend-http.rule=Host(`api.syncronize.net.pe`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # 📧 SMTP Relay
  # ========================================
  smtp-relay:
    image: juanluisbaptiste/postfix
    container_name: saas-smtp-relay
    restart: unless-stopped
    network_mode: "host"
    environment:
      - SMTP_SERVER=mail.syncronize.net.pe
      - SMTP_PORT=587
      - SMTP_USERNAME=${EMAIL_USER}
      - SMTP_PASSWORD=${EMAIL_PASS}
      - SERVER_HOSTNAME=syncronize.net.pe
      - SMTP_NETWORKS=172.16.0.0/12

# ========================================
# 🌐 Networks
# ========================================
networks:
  elastika-network:
    external: true
    name: elastika-network
