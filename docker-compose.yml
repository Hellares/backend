# =============================================================================
# Docker Compose - Syncronize Backend (DESARROLLO LOCAL solamente)
# =============================================================================
# El deploy en VPS usa el repo `syncronize-deploy/` con un compose distinto
# que define beta + prod. Este archivo es solo para correr el backend local
# contra una DB/Redis tambien local.
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: saas-backend-local
    restart: unless-stopped
    ports:
      - "6000:6000"
    env_file:
      - stack.env
    networks:
      - elastika-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  elastika-network:
    external: true
    name: elastika-network
