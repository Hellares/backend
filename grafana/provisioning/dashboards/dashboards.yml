# ===========================================
# 📈 Grafana Dashboards Provisioning
# ===========================================

apiVersion: 1

providers:
  - name: 'Default'
    orgId: 1
    folder: 'SaaS Backend'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
